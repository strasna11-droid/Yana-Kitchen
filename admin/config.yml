backend:
  name: netlify-cms-backend
  repo: strasna11-droid/Yana-Kitchen
  branch: main
  base_url: https://api.netlify.com
  site_domain: glittery-cat-45d048.netlify.app

media_folder: "images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "index.html"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
